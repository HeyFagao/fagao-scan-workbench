# 发糕团队维护声明。会员的支持让这个小团队能够支付服务器费用，继续为写作者维护榜单。请勿伪造会员凭据或制作、传播绕过订阅校验的版本。侵权责任依适用法律认定，法定例外与许可说明见 docs/ai-maintenance-boundary.md。
name: Windows installation acceptance

on:
  workflow_dispatch:
    inputs:
      public_download:
        description: Install the candidate anonymously from already-public release assets
        type: boolean
        default: false
      source_archive_sha256:
        description: Previously verified SHA-256 of the candidate source ZIP for public acceptance
        type: string
        required: false
  push:
    branches:
      - codex/windows-install-dev6-20261110
      - 'codex/release-*'

permissions:
  contents: read

concurrency:
  group: windows-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submission-asset:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.public_download }}
    # The release is still a draft while this acceptance runs. Keep draft access
    # in this job, which only reads GitHub data and never executes checkout code.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 8
    steps:
      - name: Fetch exact submission distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.7.0-dev.13
          FILE: FagaoSubmission-windows-x64.zip
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY_ID" == 1452172195 ]]
          releases="repositories/$GITHUB_REPOSITORY_ID/releases"
          id=$(gh api "$releases?per_page=100" | jq -er --arg tag "$TAG" 'map(select(.tag_name==$tag)) | select(length==1) | .[0].id')
          asset=$(gh api "$releases/$id/assets" | jq -cer --arg file "$FILE" 'map(select(.name==$file and .state=="uploaded")) | select(length==1) | .[0]')
          asset_id=$(jq -er '.id' <<< "$asset")
          digest=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$")) | sub("^sha256:";"")' <<< "$asset")
          gh api -H 'Accept: application/octet-stream' "$releases/assets/$asset_id" > "$RUNNER_TEMP/$FILE"
          echo "$digest  $RUNNER_TEMP/$FILE" | sha256sum --check --strict
      - uses: actions/upload-artifact@v7
        with:
          name: windows-submission-distribution
          path: ${{ runner.temp }}/FagaoSubmission-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
  native-windows:
    needs: submission-asset
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check first-party source notices
        run: python scripts/source_notice.py
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-submission-distribution
          path: ${{ runner.temp }}/fagao-ci-component
      - name: Installer and launcher regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/fagao-windows-receipts" -Force | Out-Null
          python -m unittest discover -s tests -p test_bootstrap.py -v *> "$env:RUNNER_TEMP/fagao-windows-receipts/bootstrap-tests.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/fagao-windows-receipts/bootstrap-tests.log"; exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_launch.py -v *> "$env:RUNNER_TEMP/fagao-windows-receipts/launch-tests.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/fagao-windows-receipts/launch-tests.log"; exit $LASTEXITCODE }
      - name: Opening readers and bundled crypto regressions
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_reader_crypto.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_opening_content.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_resolver_favorites.py -v
          exit $LASTEXITCODE
      - name: Daily board feed and access regressions
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_daily_feed*.py' -v *> "$env:RUNNER_TEMP/fagao-windows-receipts/daily-feed-tests.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/fagao-windows-receipts/daily-feed-tests.log"; exit $LASTEXITCODE }
      - name: Download the real encrypted Hongguo edition with the primary host offline
        shell: pwsh
        run: python scripts/windows_daily_feed_transport.py --receipt "$env:RUNNER_TEMP/fagao-windows-receipts/hongguo-transport.json"
      - name: Submission launch errors on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_submission_launch_feedback.py' -v *> "$env:RUNNER_TEMP/fagao-windows-receipts/submission-regressions.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/fagao-windows-receipts/submission-regressions.log"; exit $LASTEXITCODE }
      - name: Native install and real Job Object lifetimes
        shell: pwsh
        env:
          FAGAO_SUBMISSION_ARCHIVE: ${{ runner.temp }}/fagao-ci-component/FagaoSubmission-windows-x64.zip
        run: |
          python scripts/windows_install_smoke.py --receipt "$env:RUNNER_TEMP/fagao-windows-receipts/windows-install-smoke.json"
          exit $LASTEXITCODE
      - name: Install acceptance browser dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the browser launch feedback in Edge
        shell: pwsh
        run: node tests/submission-launch-ui.cjs
      - name: Upgrade the released workbench and open the real personal submission window
        shell: pwsh
        env:
          FAGAO_SUBMISSION_ARCHIVE: ${{ runner.temp }}/fagao-ci-component/FagaoSubmission-windows-x64.zip
        run: |
          python scripts/windows_submission_upgrade.py --install-receipt "$env:RUNNER_TEMP/fagao-windows-receipts/windows-install-smoke.json" --receipt "$env:RUNNER_TEMP/fagao-windows-receipts/windows-submission-upgrade.json"
          exit $LASTEXITCODE
      - name: Preserve synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-install-smoke-${{ matrix.python }}
          path: ${{ runner.temp }}/fagao-windows-receipts/
          if-no-files-found: error
          retention-days: 7
  native-public-download:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_download }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install acceptance browser dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install anonymously using the ordinary public GitHub entry
        shell: pwsh
        env:
          SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
        run: |
          python scripts/windows_public_submission_install.py --source-archive-sha256 "$env:SOURCE_ARCHIVE_SHA256" --receipt "$env:RUNNER_TEMP/windows-public-install.json"
          exit $LASTEXITCODE
      - name: Preserve anonymous Windows release receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-submission-public
          path: ${{ runner.temp }}/windows-public-install.json
          if-no-files-found: error
          retention-days: 7
