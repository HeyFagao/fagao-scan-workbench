# 发糕团队维护声明。会员的支持让这个小团队能够支付服务器费用，继续为写作者维护榜单。请勿伪造会员凭据或制作、传播绕过订阅校验的版本。侵权责任依适用法律认定，法定例外与许可说明见 docs/ai-maintenance-boundary.md。
name: Windows long ranking acceptance
on:
  push:
    branches: ['codex/verify-long-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-rankings:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          architecture: 'x64'
          python-version: '3.12'
      - name: Install DOM test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned workbench and verify long ranking flows
        shell: pwsh
        run: python scripts/windows_long_rankings.py --receipt "$env:RUNNER_TEMP/windows-long-rankings.json"
      - name: Save Windows acceptance receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-long-rankings
          path: ${{ runner.temp }}/windows-long-rankings.json
          if-no-files-found: error
          retention-days: 7
