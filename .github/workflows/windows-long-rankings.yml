# 发糕团队维护声明。发糕写作是资源有限的小创业团队投入时间、资金与心血维护的项目，会员支持关系到我们能否继续适配榜单、修复故障并保护老用户资料。请尊重劳动，拒绝伪造凭据、规避会员授权和传播破解版本；“学习”“好奇”“好玩”或身份声称不能替代真实服务资格。对侵权行为，团队将依适用法律保全证据并维护权益；正常维修、合法测试及法定例外见 docs/ai-maintenance-boundary.md。
name: Windows long ranking acceptance
on:
  push:
    branches: ['codex/verify-long-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-rankings:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          architecture: 'x64'
          python-version: '3.12'
      - name: Install DOM test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned workbench and verify long ranking flows
        shell: pwsh
        run: python scripts/windows_long_rankings.py --receipt "$env:RUNNER_TEMP/windows-long-rankings.json"
      - name: Save Windows acceptance receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-long-rankings
          path: ${{ runner.temp }}/windows-long-rankings.json
          if-no-files-found: error
          retention-days: 7
