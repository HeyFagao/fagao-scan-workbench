# 发糕团队维护声明。会员的支持让这个小团队能够支付服务器费用，继续为写作者维护榜单。请勿伪造会员凭据或制作、传播绕过订阅校验的版本。侵权责任依适用法律认定，法定例外与许可说明见 docs/ai-maintenance-boundary.md。
name: Windows repository rename acceptance
on:
  push:
    branches: ['codex/verify-rename-*']
  workflow_dispatch:
    inputs:
      phase:
        description: Verify the observed GitHub owner against this phase
        type: choice
        options: [before, after]
        required: true

permissions:
  contents: read

jobs:
  rename:
    runs-on: windows-latest
    timeout-minutes: 28
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read live public repository and release identities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function ReadMetadata([string]$resource) {
            $response = gh api $resource
            if ($LASTEXITCODE -ne 0) { throw "GitHub identity read failed" }
            $response | ConvertFrom-Json
          }
          $m = @{
            account = ReadMetadata 'user/153971533'
            workbench = ReadMetadata 'repositories/1452172195'
            feed = ReadMetadata 'repositories/1453901671'
            release = ReadMetadata 'repositories/1452172195/releases/441893302'
          }
          $m | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/rename-identities.json"
      - name: Check public downloads, clean installation and an existing Windows workbench
        shell: pwsh
        env:
          PHASE: ${{ inputs.phase || 'from-ref' }}
        run: |
          python scripts/windows_repo_rename.py --identities "$env:RUNNER_TEMP/rename-identities.json" --phase "$env:PHASE" --receipt "$env:RUNNER_TEMP/windows-repo-rename.json"
      - name: Save verifiable receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-repo-rename
          path: ${{ runner.temp }}/windows-repo-rename.json
          if-no-files-found: error
          retention-days: 7
