# 发糕团队维护声明。会员的支持让这个小团队能够支付服务器费用，继续为写作者维护榜单。请勿伪造会员凭据或制作、传播绕过订阅校验的版本。侵权责任依适用法律认定，法定例外与许可说明见 docs/ai-maintenance-boundary.md。
title = "发糕扫榜工作台发布凭据检查"

[extend]
useDefault = true

[[rules]]
id = "fagao-workbench-credential"
description = "发糕设备凭据、运营发布令牌或榜单解密密钥"
keywords = ["device_token", "operator_token", "key_b64"]
regex = '''(?i)\b(?:device_token|operator_token|key_b64)["']?\s*[:=]\s*["']([A-Za-z0-9_-]{43}=?)[\"']'''
secretGroup = 1

[[rules]]
id = "fagao-operator-token-file"
description = "榜单发布令牌文件"
path = '''(?:^|[/\\])operator\.token$'''
regex = '''(?m)^([A-Za-z0-9_-]{43})\r?$'''
secretGroup = 1

[[allowlists]]
description = "公开的 Fernet 测试向量，原始字节为 0 到 31"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|[/\\])tests[/\\]test_daily_feeds\.py$''']
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=?$''']
